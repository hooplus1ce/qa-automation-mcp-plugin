[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qa-automation-mcp"
version = "0.2.0"
description = "Advanced Enterprise QA Automation MCP Server with Playwright CDP & UI Adapters"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastmcp[apps]==3.4.4",
    "playwright>=1.60",
    "openpyxl>=3.1.5",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.0",
    "openai>=2.53.0",
]

# src-layout: 将 qa_mcp 安装进 venv (uv sync 自动 editable 安装),
# 服务/测试/CLI 均可直接 import, 无需 sys.path 手工注入。
[tool.hatch.build.targets.wheel]
packages = ["src/qa_mcp"]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
